# Build Cronch SU (debug APK) on GitHub Actions — PINNED DEBUG KEY version.
#
# Why this exists: the debug APK needs no signing secrets, AND every build
# must carry the SAME signing certificate. The kernel module crowns the
# manager only if the APK's v2 signature matches the certificate baked
# into the module (see kernel/manager/apk_sign.c + throne_tracker.c).
# A fresh per-runner debug key would never match, so this workflow installs
# the pinned debug keystore from the repo root before building.
#
# Setup (one time, by the repo owner):
#   1. Copy the pinned keystore into the repo root as `debug.keystore`
#      (the file whose certificate has SHA-256
#      4f3cc4b47a63a9d5a971ab86516bdfd4c2ae3db7e116be30a1053f2868df0324
#      and DER size 791 / 0x317). Do NOT regenerate it: the kernel module
#      cronch-su-module-android15-6.6.ko expects exactly this certificate.
#   2. Replace this file with the workflow in the repo.
#
# SECURITY TRADEOFF (accepted by the owner, "quick and dirty"): this is a
# DEBUG key and it lives in the public repo. Anyone holding it can sign a
# manager APK the kernel module will crown, and a crowned manager can grant
# root. Do not use this route for a build you distribute beyond personal
# use. The private-key route (key in GitHub secrets) replaces this file.
#
# v3/v4 signing MUST stay off: the kernel's signature-block walk rejects
# any pair id it does not know (v3 blocks fail the crown check), and ksud's
# own parser errors on v3 signatures too. The verify step below enforces
# v1+v2 only plus the exact certificate fingerprint.
#
# The Normalize signing step re-signs the built APK with apksigner and the
# pinned keystore (v1+v2 only). This guarantees the shipped artifact meets
# the crown requirements no matter what AGP's debug signing config did on
# the runner (AGP may leave v3 on despite the injected properties). It is
# a no-op when the build already signed exactly this way: same key, same
# schemes, same certificate.
#
# ksud is built from THIS tree in the same run (the build-lkm,
# build-ksuinit and build-ksud jobs below) and placed into the manager's
# jniLibs before Gradle runs, so the APK carries the current Rust
# userspace changes (--kmi/--ko-path late-load) and kernel modules
# crowned for this pinned key (KSU_EXPECTED_SIZE 0x317 / the pinned
# certificate hash). libksud.so is git-ignored, so without these jobs a
# fresh checkout builds an APK with no current ksud at all. The signing
# steps below are untouched by the ksud work.
#
# Usage: push to the main branch (or run it by hand from Actions ->
# "Build Cronch SU" -> Run workflow), then download the
# "cronch-su-debug-apk" artifact. Uninstall any Cronch SU build signed
# with a different key first: Android refuses to update across
# certificates. The app label is "Cronch SU" via -PKSU_NAME; the package
# id stays me.weishu.kernelsu on purpose, the kernel side crowns by it.

name: Build Cronch SU

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-cronch-su.yml"
      - ".github/workflows/build-lkm.yml"
      - ".github/workflows/ddk-lkm.yml"
      - ".github/workflows/ksud.yml"
      - ".github/workflows/ksuinit.yml"
      - ".github/scripts/setup-rust-build.sh"
      - "debug.keystore"
      - "manager/**"
      - "kernel/**"
      - "userspace/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "CRONCHSU.md"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-cronch-su.yml"
      - ".github/workflows/build-lkm.yml"
      - ".github/workflows/ddk-lkm.yml"
      - ".github/workflows/ksud.yml"
      - ".github/workflows/ksuinit.yml"
      - ".github/scripts/setup-rust-build.sh"
      - "debug.keystore"
      - "manager/**"
      - "kernel/**"
      - "userspace/**"
      - "Cargo.lock"
      - "Cargo.toml"
  workflow_dispatch:

jobs:
  # The kernel modules and ksuinit are built from this tree so the ksud
  # binary below embeds modules crowned for the pinned debug key. This
  # mirrors the upstream Build Manager pipeline (build-manager.yml):
  # DDK containers build kernelsu.ko per KMI, ksuinit is built from
  # source, and ksud packs both. EXPECTED_SIZE/HASH are the pinned key's
  # values from the header above; without them the module would crown
  # the official certificate instead of this manager.
  build-lkm:
    uses: ./.github/workflows/build-lkm.yml
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  # Builds ksud for arm64 from userspace/ksud in this tree, packing the
  # LKM and ksuinit artifacts above into userspace/ksud/bin/ so the
  # resulting binary embeds them (see ksud.yml).
  build-ksud:
    needs: [build-lkm, build-ksuinit]
    uses: ./.github/workflows/ksud.yml
    with:
      target: aarch64-linux-android
      pack_lkm: true
      pack_ksuinit: true

  build-debug-apk:
    needs: [build-ksud]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup NDK r29
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The pinned debug key MUST be the key every build is signed with,
      # or the kernel module will not crown the manager. AGP uses
      # ~/.android/debug.keystore for debug builds, so install it there.
      # Fails loudly if the keystore is missing from the repo root.
      - name: Install pinned debug keystore
        run: |
          test -f "$GITHUB_WORKSPACE/debug.keystore" || { echo "ERROR: debug.keystore missing at repo root; see workflow header."; exit 1; }
          mkdir -p ~/.android
          cp "$GITHUB_WORKSPACE/debug.keystore" ~/.android/debug.keystore

      # libksud.so is git-ignored, so a fresh checkout has none, and the
      # APK packages whatever sits in src/main/jniLibs. Fetch the ksud
      # built from this tree (build-ksud job above) and place it before
      # Gradle runs. Fails loudly if the artifact is missing or empty so
      # a build never ships silently without ksud.
      - name: Download built ksud artifact
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: ${{ github.workspace }}/ksud-artifact

      - name: Place built ksud into jniLibs
        working-directory: ${{ github.workspace }}
        run: |
          test -s ksud-artifact/ksud || { echo "ERROR: ksud artifact missing or empty; the ksud build step must run before Gradle."; exit 1; }
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          cp ksud-artifact/ksud manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          ls -la manager/app/src/main/jniLibs/arm64-v8a/

      - name: Build debug APK
        run: ./gradlew clean :app:assembleDebug -PKSU_NAME="Cronch SU" -Pandroid.injected.signing.v3-enabled=false -Pandroid.injected.signing.v4-enabled=false --stacktrace

      # Guarantee v1+v2-only signing with the pinned key, whatever AGP did.
      # Finds apksigner robustly and records its path for the verify step.
      - name: Normalize signing (v1+v2 only, pinned key)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $APK"
          APKSIGNER=$(command -v apksigner || find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk" -name apksigner -type f 2>/dev/null | head -n1)
          test -n "$APKSIGNER" || { echo "ERROR: apksigner not found; ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"; exit 1; }
          echo "APKSIGNER: $APKSIGNER"
          echo "$APKSIGNER" > /tmp/apksigner_path.txt
          echo "APKSIGNER_PATH=$APKSIGNER" >> "$GITHUB_ENV"
          echo "--- schemes before normalize ---"
          "$APKSIGNER" verify --verbose "$APK" || true
          "$APKSIGNER" sign --ks "$GITHUB_WORKSPACE/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false --out "$APK.normalized" "$APK"
          mv "$APK.normalized" "$APK"
          echo "--- schemes after normalize ---"
          "$APKSIGNER" verify --verbose "$APK"

      # The crown check needs v1+v2 only and this exact certificate.
      # Dumps the full outputs on failure so the cause is visible in the log.
      - name: Verify signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $APK"
          APKSIGNER="${APKSIGNER_PATH:-$(command -v apksigner || find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name apksigner -type f 2>/dev/null | head -n1)}"
          test -n "$APKSIGNER" || { echo "ERROR: apksigner not found under ANDROID_HOME; cannot verify signature schemes."; exit 1; }
          keytool -printcert -jarfile "$APK" | tee /tmp/cert.txt
          grep -q "SHA256: 4F:3C:C4:B4:7A:63:A9:D5:A9:71:AB:86:51:6B:DF:D4:C2:AE:3D:B7:E1:16:BE:30:A1:05:3F:28:68:DF:03:24" /tmp/cert.txt || { echo "ERROR: APK certificate does not match the pinned debug key."; echo "--- cert.txt ---"; cat /tmp/cert.txt; exit 1; }
          "$APKSIGNER" verify --verbose "$APK" | tee /tmp/verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/verify.txt || { echo "ERROR: v2 signature missing."; echo "--- verify.txt ---"; cat /tmp/verify.txt; exit 1; }
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): false" /tmp/verify.txt || { echo "ERROR: v3 signature present; the kernel crown check rejects v3 blocks."; echo "--- verify.txt ---"; cat /tmp/verify.txt; exit 1; }

      # NOTE: defaults.run.working-directory applies to run: steps only,
      # so this path is relative to the repo root, not ./manager.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cronch-su-debug-apk
          path: manager/app/build/outputs/apk/debug/*.apk
          retention-days: 30
